; MADE BY WR | WARRAA_
; ==============================================================================
;   WR_Export_Settings.ini  -  WR Export settings (WR Editor Fix)
; ==============================================================================
;
;   WR Export writes the Rockstar Editor's exports itself: a real bitrate or
;   constant quality, HEVC / H.264 / AV1 on your graphics card, any size up to
;   4K and beyond, your ReShade look and real camera motion blur.
;
;   On by default. Off (the editor's own stock export) in WR_Editor_Fix.ini:
;       [WR Export]
;       Enabled = 0
;   EVE installed with its enable_mod on = EVE exports instead. Pick one.
;
;   Every setting here is also in the editor: the Export screen's WR EXPORT
;   rows (Preset, Save Preset, Resolution, Codec, Encoder, Video Quality, Frame
;   Rate, Motion Blur, Blur Shutter, Blur Shape, ReShade, Sound) - a change
;   there is saved straight into this file.
;
;   This file is read again every time you press Export: change a value,
;   save, export. No restart needed.
;
;   How to change a setting: copy a value from its "Options" list and paste
;   it after the  =  sign. One value per line, nothing else after it.
;
;   Full guide:  Guides\12 - WR Export.md
;   Log:         plugins\WR Editor Fix\Logs\WR_Editor_Fix.log
;                (every [WR Export] line, plus the export speed every 2 s)
;
; ==============================================================================


[Video]

; ------------------------------------------------------------------------------
;  OutputFolder  -  where the finished videos are saved
;
;  The video is named WR_ + the name you type when you press Export (spaces
;  become _). An older video is never overwritten: the next one gets (2), (3) ...
;
;  Options:
;     (leave empty)        your Videos\WR Exports folder
;     D:\Videos\Renders    any folder you like (created if missing)
; ------------------------------------------------------------------------------
OutputFolder =

; ------------------------------------------------------------------------------
;  Preset  -  the preset last picked or saved in the Export screen (a name only:
;  the values below are what WR Export uses). Presets are the .json files in
;  plugins\WR Editor Fix\Export Presets\ - the file name is the preset's name.
;  Make your own: Export screen -> Save Preset (type a name), or
;  copy a .json there and rename it.
; ------------------------------------------------------------------------------
Preset =

; ------------------------------------------------------------------------------
;  Codec  -  the video format
;
;  HEVC (H.265) gives the same picture in a noticeably smaller file than
;  H.264 (often 30-50 % smaller). Vegas, Premiere, DaVinci Resolve and
;  YouTube all take it; very old editors and players may not - then use
;  H.264. Both export at the same speed.
;
;  Options:
;     HEVC     smaller files, same quality (falls back to H.264 when the
;              graphics card has no HEVC encoder - the log says so)
;     H.264    plays everywhere, bigger files
;     AV1      the smallest files - needs NVIDIA RTX 40 / 50, AMD RX 7000 or
;              Intel Arc, and a video editor that opens AV1 (falls back to
;              HEVC, then H.264)
; ------------------------------------------------------------------------------
Codec = HEVC

; ------------------------------------------------------------------------------
;  Encoder  -  what does the encoding
;
;  Graphics cards have their own video encoder chip (NVIDIA NVENC, AMD VCN,
;  Intel Quick Sync). It is much faster than encoding on the CPU and leaves
;  the CPU free for the game, so the export runs faster. Keep Auto unless an
;  export fails.
;
;  Options:
;     Auto     the encoder of the graphics card the game runs on (a PC with
;              CPU graphics too keeps the export on the real card)
;     CPU      Windows' software encoder - H.264 only, slower; the fallback
;              when the graphics card encoder won't work
; ------------------------------------------------------------------------------
Encoder = Auto

; ------------------------------------------------------------------------------
;  Resolution  -  the video size (the game's aspect ratio is kept)
;
;  The stock editor never exports above 1920x1080. WR Export uses the size
;  you pick here. Screen = exactly what the game renders, nothing scaled.
;
;  A size bigger than the game renders is upscaled: a bigger file, but no
;  new detail. For real 4K detail let the game render 4K (NVIDIA DLDSR /
;  AMD VSR + game resolution 3840x2160) and keep Screen.
;  Tip: YouTube gives 1440p and 4K uploads a better encode than 1080p, so
;  even an upscaled 1440p looks sharper there.
;
;  Options:
;     Screen   what the game renders (your game resolution) - recommended
;     1080p
;     1440p    (2K works too)
;     4K       (2160p)
;     720p, 1800p ...   any height from 480p to 4320p
; ------------------------------------------------------------------------------
Resolution = Screen

; ------------------------------------------------------------------------------
;  BitrateMbps  -  how many megabits per second the video gets, on average
;  (busy scenes get more, calm ones less). Higher = better quality + bigger
;  files. NOT used when CQP below is set.
;
;  File size: Mbps x 7.5 = MB per minute (100 Mbps = about 750 MB a minute).
;
;  Options:
;     Auto     picked from size + fps: 1080p60 = 60, 1440p60 = ~92, 4K60 = ~170
;     60
;     120
;     200      ... any number from 2 to 400
; ------------------------------------------------------------------------------
BitrateMbps = Auto

; ------------------------------------------------------------------------------
;  CQP  -  constant quality, like CQP in OBS
;
;  Instead of aiming for a bitrate, every frame gets the same quality level
;  (QP) and the file size follows the picture: calm shots stay small, fast
;  action gets what it needs. Lower number = better quality + bigger files.
;  When CQP is set, BitrateMbps above is ignored. Same export speed.
;  If the graphics card's encoder doesn't take CQP, the export uses
;  BitrateMbps instead and the log says so. Graphics card encoders only
;  (NVIDIA / AMD / Intel): with Encoder = CPU, BitrateMbps is always used -
;  Windows' CPU encoder doesn't do real constant quality.
;
;  Options:
;     Off      use BitrateMbps
;     10       near lossless, huge files
;     15       very high quality - great for editing in Vegas / Premiere
;     18       high quality - a good start
;     22       good, smaller files
;     28       small files, visibly softer
;     ... any number from 1 to 51
; ------------------------------------------------------------------------------
CQP = Off

; ------------------------------------------------------------------------------
;  ReShade  -  your ReShade look in the video
;
;  The stock export copies the picture before ReShade draws, so your preset
;  is missing from the video. With this on, WR has ReShade draw its effects
;  into every exported frame - the video looks like your game. Costs some
;  speed: ReShade runs for every frame the export renders.
;
;  Options:
;     1        on - needs ReShade WITH FULL ADD-ON SUPPORT
;     0        off - the plain game picture
;
;  Only ReShade with full add-on support works (tested: ReShade 6.8.0). The
;  standard ReShade download isn't supported. Don't have it? Download
;  "ReShade ... with full add-on support" from https://reshade.me and use it
;  instead of the standard one. Check: "WR Editor Fix" shows up in ReShade's
;  Add-ons tab.
; ------------------------------------------------------------------------------
ReShade = 1

; ------------------------------------------------------------------------------
;  Fps  -  the video's frame rate
;
;  Game = what you pick in the editor's export menu. A number here overrides
;  the menu, including rates the menu doesn't have (24, 50, 120 ...).
;  More fps = more frames to render: 60 fps takes twice as long as 30.
;
;  Options:
;     Game     what you pick in the editor's export menu
;     24       the cinema look
;     25
;     30
;     50
;     60       smooth - YouTube, TikTok
;     120
;     23.976
;     29.97
;     59.94
; ------------------------------------------------------------------------------
Fps = Game

; ------------------------------------------------------------------------------
;  MotionBlurSamples  -  real camera motion blur
;
;  Every video frame becomes the average of this many game frames, rendered
;  a tiny step apart in time - like a real camera's shutter. Fast cars,
;  spinning wheels and camera pans get natural streaks instead of the
;  razor-sharp game look. ReShade is applied to every sample before the
;  blend. More samples = smoother blur and a longer export: the export takes
;  about  samples  times longer than without blur (16 = about 16x).
;  While it works your screen shows the last finished video frame - normal.
;
;  Options:
;     0        off (normal export speed)
;     8        good - very fast motion can show steps
;     16       smooth - a good default
;     32       very smooth, even fast spins
;     64       maximum
;
;  Sound: with motion blur on, the game's sound comes out too long. Set
;  [Audio] Enabled = 0 for blur exports for now and add your music in your
;  video editor.
; ------------------------------------------------------------------------------
MotionBlurSamples = 0

; ------------------------------------------------------------------------------
;  MotionBlurStrength  -  how long the shutter stays open = how long the
;  streaks are. 0.5 = the film look (a 180 degree shutter, what movies use).
;
;  It does NOT change the export time: the samples are spread over the open
;  part of the frame and the closed part is skipped in one jump.
;
;  Export time in seconds = video seconds x fps x samples / 60
;  (the game renders about 60 frames a second during an export; your PC,
;  resolution and ReShade preset change that). Example: a 10 s video at
;  60 fps with 16 samples = 10 x 60 x 16 / 60 = 160 s, under 3 minutes.
;
;  Options:
;     0.25     short streaks
;     0.5      film look (180 degree shutter)
;     0.75     longer streaks
;     1        the longest streaks (360 degree shutter)
; ------------------------------------------------------------------------------
MotionBlurStrength = 0.5

; ------------------------------------------------------------------------------
;  MotionBlurShape  -  how the blended frames are mixed (same export time)
;
;  Options:
;     Soft     the middle of the shutter counts most, the streak ends fade -
;              smoother, fewer visible copies of fast things (wheels, cars)
;     Even     every frame counts the same, like a plain camera shutter
; ------------------------------------------------------------------------------
MotionBlurShape = Soft


[Audio]

; ------------------------------------------------------------------------------
;  Enabled  -  the game's sound in the video
;
;  Options:
;     1        on
;     0        off - use this for motion blur exports for now (with blur the
;              sound comes out several times too long)
; ------------------------------------------------------------------------------
Enabled = 1

; ------------------------------------------------------------------------------
;  BitrateKbps  -  sound quality (AAC). 192 is plenty for game sound.
;
;  Options:
;     96
;     128
;     160
;     192      best
; ------------------------------------------------------------------------------
BitrateKbps = 192
