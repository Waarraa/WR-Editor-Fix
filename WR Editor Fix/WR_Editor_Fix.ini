; WR Editor Fix configuration (USER settings)
; Lives at: <FiveM plugins>\WR Editor Fix\WR_Editor_Fix.ini - next to the .asi.
; Edit a value, save, relaunch FiveM. Lines starting with ; are comments.
;
; The release ships this file ready to use. The plugin only writes back the
; values you change in the editor itself (WR Options: Font, Colors, Header
; Style / Motion, Camera Speed and the WR Automate page), each into its own
; line; everything else stays exactly as you wrote it.
;
; Tested on FiveM game build b3258. It loads on every build FiveM supports,
; but on other builds (the number in a crash window, e.g. GTA5_b3095.exe) some
; fixes may not apply and some features switch themselves off - see the
; README's build table.
; Developer/experimental keys are NOT here - they live in the optional
; WR_Editor_Fix_Dev.ini (see the note at the bottom of this file).

;==============================================================================
;  WR Editor Fix  -  configuration
;
;  Edit a value, save the file, relaunch FiveM. Lines starting with ; are
;  comments. Unless a line says otherwise: 1 = on, 0 = off.
;  Logs go to the Logs\ subfolder next to this file (created automatically).
;  If you report a crash, send everything in Logs\.
;==============================================================================


;------------------------------------------------------------------------------
;  [Logging]   -   which files this plugin writes
;------------------------------------------------------------------------------
[Logging]

; SessionLog  -  WR_Editor_Fix.log, the main activity log.
;   0 = off       nothing written
;   1 = normal    startup + each unique crash point recovered once   (default)
;   2 = verbose   + periodic recovery totals
;   3 = debug     + every single recovered fault (very noisy)
SessionLog = 1

; CameraFeaturesLog  -  1 = include the editor-camera feature lines
;   ("[Camera] [Leash] ...", zoom / collision / move-speed engaged, values
;   applied) in WR_Editor_Fix.log. 0 = leave them out.
CameraFeaturesLog = 1

; BrokenAssetsReport  -  WR_BrokenAssets.log, the list of stuck/broken server
;   downloads (from ReportStuckDownloads or SkipStuckDownloads in
;   [Stuck Downloads]) - a plain summary for your server owner. Harmless to
;   leave on.
BrokenAssetsReport = 1

; FreshLogs  -  1 = wipe every WR_*.log in this folder on each launch,
;               0 = keep appending across launches.
FreshLogs = 1


;------------------------------------------------------------------------------
;  [Crash Fix]   -   the core Rockstar Editor crash fix. Leave these on.
;------------------------------------------------------------------------------
[Crash Fix]

; ExceptionHandler  -  the safety net that catches the editor's clip-load
;   crash family and recovers from it. This is the main fix.
ExceptionHandler = 1

; InlineGuards  -  extra null-checks placed right at the known crash
;   instructions. Recommended.
InlineGuards = 1

; WholeGameProtection
;   1 = guard the whole game module (default, best - also catches the same
;       bug in streaming / asset-unload code on heavy custom-asset servers)
;   0 = guard only the editor code region (tighter, but may miss some)
WholeGameProtection = 1

; GrowStreamingList  -  1 = fix the "ERR_STR_INFO_2" / "ERR_STR_INFO_3" and
;   "ERR_GEN_MAP" game errors. The game keeps fixed-size streaming lists; on
;   heavy servers a big world swap (a teleport, a cutscene loading, an export
;   starting) fills them and the game stops. When one runs full, the plugin
;   adds more room to it instead. Works in game and in the editor. Game build
;   b3258 only. 0 = off (default).
GrowStreamingList = 1

; NveExportFreezeFix  -  1 = stop the "FiveM has stopped responding" freeze
;   when an EVE export starts with NVE (NaturalVision Evolved). Only does
;   anything while NVE.asi is loaded; NVE itself isn't changed. 0 = off.
NveExportFreezeFix = 1

; EveSwapChainFix  -  1 = stop the crash a few seconds after launch with EVE
;   (ExtendedVideoExport) + NVE's ReShade .addon (Shader Toggler).
;   Only does anything while EVE and ReShade are both loaded. WR Editor Fix
;   then shows up in ReShade's Add-ons section - leave it ticked. 0 = off.
EveSwapChainFix = 1

; EmptyNameLookupFix  -  1 = fix a crash when an export loads a clip with an
;   item that has no name (arizona-beryllium-river). Game build b3258 only.
;   0 = off.
EmptyNameLookupFix = 1


;------------------------------------------------------------------------------
;  [Stuck Downloads]   -   OPTIONAL / EXPERIMENTAL.
;  Fixes the editor hanging forever on "Downloading assets (0 of N)" /
;  "0.00 / 0.2 MB" when a server references an asset that 404s (e.g. missing
;  scenario region .ymt files). Less battle-tested than the crash fix above -
;  off by default, only turn on if you actually hit that infinite hang.
;
;  Only acts while the Rockstar Editor is open (editing or exporting). While
;  you play on a server it never releases anything, it only reports - so it
;  is safe to leave on. (In gameplay a heavy server's map models can be slow
;  but healthy; releasing those could stop the game with ERR_STR_MOD_INFO.)
;------------------------------------------------------------------------------
[Stuck Downloads]

; SkipStuckDownloads  -  1 = release an un-fetchable asset after TimeoutMs so
;   the editor or export continues (that asset just won't appear). Only acts
;   inside the Rockstar Editor (see above).
SkipStuckDownloads = 0

; ReportStuckDownloads  -  1 = list server downloads that never finish (stuck
;   longer than TimeoutMs) in WR_BrokenAssets.log, to send to the server
;   owner. Only LISTS them - nothing is skipped, safe while you play.
;   Default 1 (on). 0 = off.
ReportStuckDownloads = 1

; SkipStuckLocalAssets  -  1 = also release a genuinely frozen LOCAL entry
;   once it clears the same timeout (a broken download can leave local
;   entries stuck too, so this is usually needed). 0 = strict: only ever
;   release confirmed cache:/ downloads.
SkipStuckLocalAssets = 1

; TimeoutMs  -  how long an entry may hang before it's skipped. Default 12000.
TimeoutMs = 12000


;------------------------------------------------------------------------------
;  [Vehicle Meta]   -   OPTIONAL / EXPERIMENTAL.
;  Some servers ship a custom vehicle with a broken carvariations/handling
;  file. The game fails to parse it, then gets stuck in an endless loop the
;  moment a clip using that vehicle is loaded into a project (the editor
;  hangs, then dies with "Out of game memory" / "Invalid Pointer Free").
;  This remembers any vehicle file the game itself reports as malformed and
;  skips loading it from then on - same as if the server never shipped that
;  file. That vehicle may lose its custom colours/kits in the preview only.
;  The list is saved to WR_BrokenVehicleMeta.txt in this folder; delete
;  that file to forget everything learned.
;------------------------------------------------------------------------------
[Vehicle Meta]

; SkipBrokenVehicleMeta  -  1 = learn malformed vehicle meta files and skip
;   them on every later load. 0 = off (default).
SkipBrokenVehicleMeta = 1


;==============================================================================
;  [Recording]   -   Rockstar Editor recording (in game, not in the editor).
;------------------------------------------------------------------------------
[Recording]

; AllowCutsceneRecording  -  1 = let the Rockstar Editor keep recording while
;   a GTA V cutscene plays (or loads). The game normally stops recording the
;   moment the player isn't in control. This only changes that one decision;
;   all other recording limits stay. Game build b3258 only (other builds: the
;   log says it is not armed).
;   To move the camera freely on those clips in the editor, also turn on
;   [Editor Camera] FreeCameraOnBlockedClips.
AllowCutsceneRecording = 1


;==============================================================================
;  [Editor Camera]   -   remove the Rockstar Editor free-camera restrictions.
;  Every option here is independent and off by default. Each one reads and
;  sanity-checks the game's real values before changing anything, and puts
;  them back the moment you set it to 0.
;
;  LIVE RELOAD: this section is re-read from disk about once a second while
;  FiveM is running - edit a value, save, and it takes effect in-game within
;  a second. No relaunch needed. (Every other section still needs a relaunch.)
;==============================================================================
[Editor Camera]

;  - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
;   Working   -   tested live, confirmed stable
;  - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

; UnlimitedCameraDistance  -  remove the leash that pulls the free-cam back
;   when it flies too far from the subject.
;   Rockstar Editor+ installed with its own UnlimitedCameraDistance on: RE+
;   handles this and WR skips it (one line in the log says so).
UnlimitedCameraDistance = 1
;   MaxCameraDistance  -  new limit, in metres (used when the above is 1).
MaxCameraDistance = 1000

; UncapZoom  -  widen the free-cam zoom range past its stock ~10-100 degrees.
;   The engine's shared 1..130 hard ceiling is deliberately left alone.
;   Rockstar Editor+ installed with its own UncapZoom on: RE+ handles this
;   and WR skips it.
UncapZoom = 1
;   ZoomMinFov / ZoomMaxFov  -  degrees (used when UncapZoom = 1).
ZoomMinFov = 1.0
ZoomMaxFov = 130.0

; DisableCameraCollision  -  let the editor camera pass through anything:
;   walls and the map, the car or ped it is attached to or looking at, and
;   objects between two markers (no more "Unable to apply camera blend due
;   to object collision" jump).
DisableCameraCollision = 1

; FreeCamMoveSpeed  -  scale how fast the free-cam flies. The stock editor
;   caps it fairly low; this multiplies that cap.
FreeCamMoveSpeed = 1
;   FreeCamMoveSpeedMultiplier  -  1.0 = stock, 3.0 = 3x, etc (~0.25 to ~20).
;   Also in the editor: marker menu -> WR Options -> Camera Speed (live). A
;   speed picked there is saved back into this line.
;   LIVE: change this while the editor is open and flying - it applies
;   within ~1 second, no relaunch needed (see the LIVE RELOAD note at the
;   top of this section).
FreeCamMoveSpeedMultiplier = 3.0

;  - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
;   Blocked clips   -   needs a relaunch (not live-reloaded)
;  - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

; FreeCameraOnBlockedClips  -  free camera on clips the editor marks as
;   camera-blocked: clips recorded during a GTA V cutscene (see
;   [Recording] AllowCutsceneRecording) and first-person clips. Unlocks the
;   marker Cameras menu and lets the editor camera move. Game build b3258
;   only (other builds: the log says it is not armed).
FreeCameraOnBlockedClips = 1


;==============================================================================
;  [Editor Playback]   -   how the editor plays your clip while you edit.
;  Needs a relaunch (not live-reloaded). Game build b3258 only.
;==============================================================================
[Editor Playback]

; NoSeekStall  -  cut the freeze after every seek, cut and marker move.
;   The editor waits until the WHOLE game has finished streaming before it
;   plays on. On a busy server that never happens, so it waits ~7 s every
;   time. With 1 it waits at most NoSeekStallWaitMs, then plays on; anything
;   still loading pops in a moment later. Exports always keep the full wait,
;   so the rendered video is fully loaded.
NoSeekStall = 1
;   NoSeekStallWaitMs  -  longest wait after a seek, in ms (about: it counts
;   frame time). 0 = no wait at all, 6600 = stock. 100 = recommended (tested:
;   no stall at all); raise it if things pop in too much.
NoSeekStallWaitMs = 100


;==============================================================================
;  [Editor Time Weather]   -   play a clip at another time of day and weather.
;  In the editor: marker menu -> WR Options (Enter) -> Hour / Minute /
;  Weather / Default. Changes show live and the export renders the same look.
;  Your pick stays for every clip until you press Default or restart FiveM.
;  Nothing is written into the clip. Game build b3258 only.
;==============================================================================
[Editor Time Weather]

; TimeWeatherOverride  -  1 = start with the Time and Weather below instead of
;   the clip's own (the WR Options page can still change them). 0 = as
;   recorded (default). Live: edit + save, it applies within a second.
TimeWeatherOverride = 0
; Time  -  HH:MM, 24 h (00:00 - 23:59). Blank = the clip's own time.
Time = 12:00
; Weather  -  EXTRASUNNY, CLEAR, CLOUDS, SMOG, FOGGY, OVERCAST, RAIN, THUNDER,
;   CLEARING, NEUTRAL, SNOW, BLIZZARD, SNOWLIGHT, XMAS, HALLOWEEN.
;   Blank = the clip's own weather.
Weather = EXTRASUNNY
; MenuRows  -  1 = WR Editor Fix's rows in the editor's marker menus (default):
;   WR Options (time + weather, Camera Speed, the look, WR Garage, Director
;   Mode, WR Automate, Clear Timeline), WR Marker Options (time + weather and
;   Car Look per marker) and the WR choices under Cameras (WR blend, WR shake).
;   0 = none of them, only the ini keys above. Needs a relaunch.
MenuRows = 1


;==============================================================================
;  [WR Automate]   -   the editor builds the camera edit for you.
;  Marker menu -> WR Options -> WR Automate: pick the car or ped to follow,
;  how long, how many markers, the shot style and the shake, then Automate.
;  The clip's timeline starts fresh, the car's path is scouted, and WR
;  Automate places its own markers with free cameras around it: WR blend,
;  the shake, the car always centred on screen, the cameras kept clear of
;  cars, peds, props and walls (close to the ground is fine). Everything
;  stays editable afterwards. Back stops it while it scouts.
;  WR Options -> Clear Timeline (Enter twice) puts a clip back to a fresh
;  one: every marker and setting back to default. No undo.
;  Game build b3258 only.
;==============================================================================
[WR Automate]

; Enabled  -  1 = the WR Automate and Clear Timeline rows in WR Options
;   (default). 0 = both rows gone. Needs a relaunch.
Enabled = 1

; The WR Automate page starts with the values below. Change them in the
; editor and they are saved back here (about 1 s after the last change).
; Follow  -  Car = the car the recorded player drives, Ped = the player.
Follow = Car
; Length  -  how long the video is, from the clip's start: 0 = the whole
;   clip, or 5, 8, 10, 12, 15, 20, 25, 30, 45, 60 seconds (the end marker
;   moves there).
Length = 0
; Markers  -  how many markers WR Automate makes between the clip's start
;   and end marker, 3 - 30. More markers = more camera moves.
Markers = 8
; Style  -  Mixed  = sweeps round to the sides and the front
;           Orbit  = circles the car the whole way
;           Chase  = stays behind it, swinging up high
Style = Mixed
; Shake  -  Auto = a shake that fits each shot (Car, Helicopter on high
;   shots, Handheld on the sides), Off, or one preset for every marker:
;   Handheld, Walk, Run, Car, Helicopter, Earthquake.
Shake = Auto

; AvoidObstacles  -  1 = after placing the markers, WR Automate runs along
;   the clip again and moves any camera that would touch or look through a
;   car, ped, prop or wall (default). 0 = no checks: faster, the cameras stay
;   exactly on their shots. Read every time you press Automate.
AvoidObstacles = 1


;==============================================================================
;  [Editor Look]   -   how the Rockstar Editor looks. Everything about the
;  editor's look lives here: the theme, the header logo, the font and colours.
;  Only while the editor is open; the game looks stock everywhere else.
;  Game build b3258 only.
;
;  Colours: RRGGBB hex (E01234 = WR red). Blank = the built-in colour.
;     FFFFFF = white        000000 = black        808080 = grey
;     FF0000 = red          00FF00 = green        0000FF = blue
;     FFFF00 = yellow       00FFFF = cyan         FF00FF = magenta / pink
;     FF8000 = orange       8000FF = purple       E01234 = WR red
;  Any colour picker (Photoshop, Vegas, google "color picker") shows the hex
;  code - copy the 6 characters without the #.
;==============================================================================
[Editor Look]

; Theme  -  the editor's whole look:
;   Default = the stock Rockstar Editor
;   Neon    = WR Neon Glass: frosted glass menu with a neon pill on the selected
;             row, one glass panel for the time + playback buttons, a slim
;             timeline with a red played line, a glowing playhead and diamond
;             markers. Only on the clip edit screen (where
;             you edit markers) - the other editor screens stay stock.
;   Takes effect the next time the editor opens.
Theme = Neon

; Header  -  the logo at the top of the editor menu: Stock (the original
;   R* EDITOR), WR, Meme, Retro or Cinematic. Built into the .asi.
;   Also in the editor: marker menu -> WR Options -> Header Style / Header
;   Motion switch it live, and the pick is saved back into these lines.
Header = Meme
; HeaderAnimated  -  1 = animated (Meme, Retro, Cinematic move), 0 = still picture.
HeaderAnimated = 1

; Font  -  the font of every editor menu and text (both themes). Built into the
;   .asi, free fonts from Google Fonts (licences in the release's Fonts folder).
;     Default           the original Rockstar Editor font
;     Chakra Petch      techy, clean
;     Spicy Rice        wild, chunky
;     Bagel Fat One     round, bubbly
;     Oswald            clean, condensed
;     Carter One        bold, playful
;     Ubuntu Mono       code style
;     Permanent Marker  marker pen
;     Germania One      old-style blackletter
;     Kavoon            fat brush
;     Sriracha          handwriting
;   Also in the editor: marker menu -> WR Options -> Font switches it live, and
;   the pick is saved back into this line.
Font = Default

; --- Neon colours (Theme = Neon). Blank = the built-in colour shown in ( ).
;   Also in the editor: marker menu -> WR Options -> Colors picks them live
;   from a palette and saves them back into these lines.
; Glass  -  the frosted glass: menu panel, time + button panel, timeline rail (404A68).
Glass =
; Selection  -  the neon pill around the selected menu row (FF2D55).
Selection =
; Buttons  -  the glow of the playback buttons, hover + pressed (FF2D55).
Buttons =
; Icons  -  the playback button icons themselves (FFFFFF).
Icons =
; Time  -  the time above the playback buttons (FFFFFF).
Time =
; Timeline  -  the played line and the glowing playhead (FF2D55).
Timeline =
; Markers  -  the diamond markers on the timeline, start + end included (2DE2FF).
Markers =
; HelpBox  -  the box with the help line under the menu (1E2436).
HelpBox =

; --- Default theme options (Theme = Default; Neon uses its own).
;   MenuText + MenuTextGreyed are also in WR Options -> Colors (live, saved here).
; MenuText  -  row labels + values (Camera Type, Free Camera, None, 100%...)
;   and the playhead marker on the timeline.
MenuText =
; MenuTextGreyed  -  greyed-out rows, the timeline's played region + range
;   handles, and the second timecode top-right.
MenuTextGreyed =


;==============================================================================
;  [Editor Loading Screen]   -   the WR loading screen when you open the
;  Rockstar Editor from FiveM's main menu (instead of FiveM's default one).
;  Shown the moment you press "Rockstar Editor" + Yes, closes by itself when
;  the editor is ready. Double-click it to close it early.
;  Needs the Microsoft Edge WebView2 Runtime - built into Windows 11; on
;  Windows 10 it comes with Microsoft Edge (if it's missing, the log says so
;  and FiveM's own screen is used). Works best with the game in
;  "Windowed Borderless" mode.
;
;  !! TESTED ON WINDOWS 11 !!
;  On Windows 10, or if anything looks wrong while the editor opens (black,
;  white or frozen screen, flickering, the game minimising, a missing or
;  double mouse cursor, a crash right after pressing "Rockstar Editor"), set
;  LaunchScreen = 0 below to be safe. FiveM's own loading screen comes back and
;  NOTHING else changes - the crash fix and every other feature keep working.
;  Please send your Logs folder on Discord so it can be fixed:
;  discord.gg/FKJ27bhqfJ
;==============================================================================
[Editor Loading Screen]

; LaunchScreen  -  1 = on, 0 = off (FiveM's default loading screen).
LaunchScreen = 1

; LaunchScreenTimeoutSec  -  safety cap: the screen closes after this many
;   seconds even if the editor never reports ready. 30..900, default 300.
LaunchScreenTimeoutSec = 300

; ClipScreen  -  1 = the WR clip screen while a clip loads in the editor
;   (after pressing Edit on a clip), instead of the stock "Preparing clip"
;   screen. Closes by itself when the editor is ready. 0 = stock screen.
ClipScreen = 1

; UpdateCheck  -  1 = the loading screen asks GitHub for the latest WR Editor
;   Fix releases (update log + "Update available" note when a newer version
;   is out). 0 = no network request, the built-in update log is shown.
UpdateCheck = 1



;------------------------------------------------------------------------------
;  Developer / experimental settings (menu-row WIP, diagnostic scans, unsafe
;  experiments) are NOT in this file any more. They live in an optional
;  WR_Editor_Fix_Dev.ini next to this one, which the release doesn't ship -
;  if it's absent, everything in it is simply off.
;------------------------------------------------------------------------------
