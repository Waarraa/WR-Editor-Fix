; Tested on FiveM game builds b3258, b3095 and b3407. It loads on every build FiveM
; supports, but on other builds (the number in a crash window, e.g. GTA5_b3570.exe) some
; fixes may not apply and some features switch themselves off - see the
; README's build table.
; Developer/experimental keys are NOT here - they live in the optional
; WR_Editor_Fix_Dev.ini (see the note at the bottom of this file).

;==============================================================================
;  WR Editor Fix  -  configuration
;
;  Edit a value, save the file, relaunch FiveM. Lines starting with ; are
;  comments. Unless a line says otherwise: 1 = on, 0 = off.
;  Logs go to the Logs\ subfolder next to this file (created automatically).
;  If you report a crash, send everything in Logs\.
;==============================================================================


;------------------------------------------------------------------------------
;  [Logging]   -   which files this plugin writes
;------------------------------------------------------------------------------
[Logging]

; SessionLog  -  WR_Editor_Fix.log, the main activity log.
;   0 = off       nothing written
;   1 = normal    startup + each unique crash point recovered once   (default)
;   2 = verbose   + periodic recovery totals
;   3 = debug     + every single recovered fault (very noisy)
SessionLog = 1

; CameraFeaturesLog  -  1 = include the editor-camera feature lines
;   ("[Camera] [Leash] ...", zoom / collision / move-speed engaged, values
;   applied) in WR_Editor_Fix.log. 0 = leave them out.
CameraFeaturesLog = 1

; FreshLogs  -  1 = wipe every WR_*.log in this folder on each launch,
;               0 = keep appending across launches.
FreshLogs = 1


;------------------------------------------------------------------------------
;  [Crash Fix]   -   the core Rockstar Editor crash fix. Leave these on.
;------------------------------------------------------------------------------
[Crash Fix]

; ExceptionHandler  -  the safety net that catches the editor's clip-load
;   crash family and recovers from it. This is the main fix.
ExceptionHandler = 1

; InlineGuards  -  extra null-checks placed right at the known crash
;   instructions. Recommended.
InlineGuards = 1

; WholeGameProtection  -  the safety net only ever works while the Rockstar
;   Editor is open (main menu, playing on a server: it does nothing).
;   1 = watch all game code while the editor is open (default, best - also
;       catches crashes outside the editor's own code, e.g. at export start)
;   0 = watch only the editor's own code (b3258; tighter, misses some)
WholeGameProtection = 1

; GrowStreamingList  -  1 = fix the "ERR_STR_INFO_2" / "ERR_STR_INFO_3" and
;   "ERR_GEN_MAP" game errors during editing and exports. The game keeps
;   fixed-size streaming lists; on heavy servers a big world swap (a cutscene
;   loading, an export starting) fills them and the game stops. When one runs
;   full, the plugin adds more room to it. v1.0.1: only acts while the
;   Rockstar Editor is open, never while you play. Game builds b3258, b3095 +
;   b3407 only. 0 = off.
GrowStreamingList = 1

; NveExportFreezeFix  -  1 = stop the "FiveM has stopped responding" freeze
;   when an export starts with NVE (NaturalVision Evolved). Only does
;   anything while NVE.asi is loaded; NVE itself isn't changed. 0 = off.
NveExportFreezeFix = 1

; EmptyNameLookupFix  -  1 = fix a crash when an export loads a clip with an
;   item that has no name (arizona-beryllium-river). Game builds b3258, b3095 + b3407 only.
;   0 = off.
EmptyNameLookupFix = 1


;==============================================================================
;  [Recording]   -   Rockstar Editor recording (in game, not in the editor).
;------------------------------------------------------------------------------
[Recording]

; AllowCutsceneRecording  -  OPT-IN, off by default. 1 = the Rockstar
;   Editor keeps recording while a GTA V cutscene plays or loads (normally the
;   game stops the recording the moment you aren't in control). It changes one
;   GTA V recording check WHILE YOU PLAY - recording happens in game, so unlike
;   everything else it can't wait for the editor. It never touches FiveM's own
;   code. 0 = off (default). Game builds b3258, b3095 + b3407 only.
;   To move the camera freely on those clips in the editor, also turn on
;   [Editor Camera] FreeCameraOnBlockedClips.
AllowCutsceneRecording = 0

; ---- Longer Recordings ----
; ON by default: the Rockstar Editor records much longer clips (up to about
;   3 minutes in busy city traffic, more in quiet areas). It sets the game's
;   replay memory when FiveM starts and stays on while you play, because
;   recording happens in game. Set RecordBlocks = 0 to turn it off.
; RecordBlocks  -  how much replay memory a recording gets, in 4 MB blocks.
;   0 = off (the game's own size, ~17 s in a busy city up to ~1 min on an
;   empty road). Auto (default) = the biggest size your PC's memory
;   comfortably allows:
;     under 8 GB RAM: off | 8 GB: 64 | 16 GB: 128 | 24 GB: 192 | 32 GB+: 220
;   Or a number 30 - 220 (220 = ~1 GB, the most the game's replay memory can
;   handle). Rough recording length in the BUSIEST city traffic:
;     64 = ~45 s | 128 = ~1m45s | 192 = ~2.5 min | 220 = ~3 min
;   Quiet areas record much longer. When the memory fills, the game saves the
;   clip and keeps recording into a new one. If Windows can't give the memory,
;   a smaller size is used (the log says which). Needs a FiveM restart.
;   Each block costs ~4.4 MB of RAM while the game runs, and long clips take
;   more disk space (128 blocks ~230 MB per clip).
RecordBlocks = Auto
; OpenLongClips  -  1 = clips recorded with up to 128 blocks open too, even
;   with RecordBlocks = 0. 0 = off (default). RecordBlocks above 30 does this
;   automatically.
OpenLongClips = 0



;==============================================================================
;  [Editor Camera]   -   remove the Rockstar Editor free-camera restrictions.
;  Every option here is independent and off by default. Each one reads and
;  sanity-checks the game's real values before changing anything, and puts
;  them back the moment you set it to 0.
;
;  LIVE RELOAD: this section is re-read from disk about once a second while
;  FiveM is running - edit a value, save, and it takes effect in-game within
;  a second. No relaunch needed. (Every other section still needs a relaunch.)
;==============================================================================
[Editor Camera]

;  - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
;   Working   -   tested live, confirmed stable
;  - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

; UnlimitedCameraDistance  -  remove the leash that pulls the free-cam back
;   when it flies too far from the subject.
;   Another editor plugin with its own camera distance unlock on: it keeps
;   doing this and WR skips it (one line in the log says so).
UnlimitedCameraDistance = 1
;   MaxCameraDistance  -  new limit, in metres (used when the above is 1). Also the
;   row WR Options -> WR Camera -> Camera Range (100 - 15000), live.
MaxCameraDistance = 1000

; UncapZoom  -  widen the free-cam zoom range past its stock ~10-100 degrees.
;   The engine's shared 1..130 hard ceiling is deliberately left alone.
;   Another editor plugin with its own zoom unlock on: it keeps doing this
;   and WR skips it.
UncapZoom = 1
;   ZoomMinFov / ZoomMaxFov  -  degrees (used when UncapZoom = 1).
ZoomMinFov = 1.0
ZoomMaxFov = 130.0

; DisableCameraCollision  -  let the editor camera pass through anything:
;   walls and the map, the car or ped it is attached to or looking at, and
;   objects between two markers (no more "Unable to apply camera blend due
;   to object collision" jump).
DisableCameraCollision = 1

; FreeCamMoveSpeed  -  scale how fast the free-cam flies. The stock editor
;   caps it fairly low; this multiplies that cap.
FreeCamMoveSpeed = 1
;   FreeCamMoveSpeedMultiplier  -  1.0 = stock, 3.0 = 3x, etc (~0.25 to ~20).
;   Also in the editor: marker menu -> WR Options -> Camera -> Move Speed
;   (live). A speed picked there is saved back into this line.
;   LIVE: change this while the editor is open and flying - it applies
;   within ~1 second, no relaunch needed (see the LIVE RELOAD note at the
;   top of this section).
FreeCamMoveSpeedMultiplier = 3.0

; TurnSpeedUpDown / TurnSpeedLeftRight  -  how fast a CONTROLLER turns the
;   free cam up / down and right / left. 1 = super slow, 12 = super fast,
;   6 = stock (1 = x0.1, 12 = x8.5). The mouse keeps the game's own mouse
;   sensitivity. Also in the editor: marker menu -> WR Options -> Camera
;   (live); a speed picked there is saved back into these lines.
TurnSpeedUpDown = 6
TurnSpeedLeftRight = 6

;  - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
;   Blocked clips   -   needs a relaunch (not live-reloaded)
;  - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

; FreeCameraOnBlockedClips  -  free camera on clips the editor marks as
;   camera-blocked: clips recorded during a GTA V cutscene (see
;   [Recording] AllowCutsceneRecording) and first-person clips. Unlocks the
;   marker Cameras menu and lets the editor camera move. Game builds b3258,
;   b3095 + b3407 only (other builds: the log says it is not armed).
FreeCameraOnBlockedClips = 0


;==============================================================================
;  [Editor Playback]   -   how the editor plays your clip while you edit.
;  Needs a relaunch (not live-reloaded). Game builds b3258, b3095 + b3407 only.
;==============================================================================
[Editor Playback]

; NoSeekStall  -  cut the freeze after every seek, cut and marker move.
;   The editor waits until the WHOLE game has finished streaming before it
;   plays on. On a busy server that never happens, so it waits ~7 s every
;   time. With 1 it waits at most NoSeekStallWaitMs, then plays on; anything
;   still loading pops in a moment later. Exports always keep the full wait,
;   so the rendered video is fully loaded.
NoSeekStall = 1
;   NoSeekStallWaitMs  -  longest wait after a seek, in ms (about: it counts
;   frame time). 0 = no wait at all, 6600 = stock. 100 = recommended (tested:
;   no stall at all); raise it if things pop in too much.
NoSeekStallWaitMs = 100


;==============================================================================
;  [Editor Time Weather]   -   play a clip at another time of day and weather.
;  In the editor: marker menu -> WR Options (Enter) -> Hour / Minute /
;  Weather / Default. Changes show live and the export renders the same look.
;  Your pick stays for every clip until you press Default or restart FiveM.
;  Nothing is written into the clip. Game builds b3258, b3095 + b3407 only.
;==============================================================================
[Editor Time Weather]
; TimeWeather  -  1 = WR Time & Weather on (default). 0 = fully off: none of
;   its code runs, the WR Time & Weather page is hidden and the per-marker time
;   + weather (WR Marker Options) does nothing - every clip plays its recorded
;   time, weather and lighting. Only for testing a lighting problem. Needs a
;   FiveM restart.
TimeWeather = 1

; LiveLighting  -  how a clip without WR time / weather is lit.
;   Auto = on for game build b3407, off for the others (default).
;   1 = every clip plays at its own recorded time + weather, but the game lights
;   it live (like when you set an hour on the WR Time & Weather page).
;   0 = every clip plays its recorded lighting values.
;   Why: on b3407 the recorded lighting values gave every headlight a huge glow
;   and the picture a purple tint - lit live it looks right. Read live.
LiveLighting = Auto

; TyreMarks  -  1 = tyre / skid marks (and other decals: blood, bullet holes) show as
;   recorded (default). 0 = the clip without them, preview and export. Also the row
;   WR Options -> WR World -> Tyre Marks.
TyreMarks = 1


; TimeWeatherOverride  -  1 = start with the Time and Weather below instead of
;   the clip's own (the WR Options page can still change them). 0 = as
;   recorded (default). Live: edit + save, it applies within a second.
TimeWeatherOverride = 0
; Time  -  HH:MM, 24 h (00:00 - 23:59). Blank = the clip's own time.
Time = 12:00
; Weather  -  EXTRASUNNY, CLEAR, CLOUDS, SMOG, FOGGY, OVERCAST, RAIN, THUNDER,
;   CLEARING, NEUTRAL, SNOW, BLIZZARD, SNOWLIGHT, XMAS, HALLOWEEN.
;   Blank = the clip's own weather.
Weather = EXTRASUNNY
; MenuRows  -  1 = WR Editor Fix's rows in the editor's marker menus (default):
;   WR Options (time + weather, Camera Speed, the look, WR Garage, Director
;   Mode, WR Automate, Clear Timeline), WR Marker Options (time + weather and
;   Car Look per marker) and the WR choices under Cameras (WR blend, WR shake).
;   0 = none of them, only the ini keys above. Needs a relaunch.
MenuRows = 1


;==============================================================================
;  [WR Garage]   -   tune the clip's car in the editor.
;  Marker menu -> WR Options -> WR Garage (or WR Marker Options -> Car Look
;  for one marker): paint, finish, pearl, wheel colour, livery, neon, xenon,
;  window tint, plate, every body part + wheels, randomise. Editor only - the
;  replay's own car data, nothing while playing on a server.
;==============================================================================
[WR Garage]

; PlateTexts  -  the plate texts the Plate Text row cycles through, comma
;   separated, up to 8 characters each (letters, digits, spaces; the plate
;   font has no lower case). Default: WR, WR EDIT, WARRAA, CINEMA, DRIFT, NIGHTRUN
PlateTexts = WR, WR EDIT, WARRAA, CINEMA, DRIFT, NIGHTRUN


;==============================================================================
;  [WR Automate]   -   the editor builds the camera edit for you.
;  Marker menu -> WR Options -> WR Automate: pick the car or ped to follow,
;  how long, how many markers, the shot style and the shake, then Automate.
;  The clip's timeline starts fresh, the car's path is scouted, and WR
;  Automate places its own markers with free cameras around it: WR blend,
;  the shake, the car always centred on screen, the cameras kept clear of
;  cars, peds, props and walls (close to the ground is fine). Everything
;  stays editable afterwards. Back stops it while it scouts.
;  WR Options -> Clear Timeline (Enter twice) puts a clip back to a fresh
;  one: every marker and setting back to default. No undo.
;  Game builds b3258, b3095 + b3407 only.
;==============================================================================
[WR Automate]

; Enabled  -  1 = the WR Automate and Clear Timeline rows in WR Options
;   (default). 0 = both rows gone. Needs a relaunch.
Enabled = 1

; The WR Automate page starts with the values below. Change them in the
; editor and they are saved back here (about 1 s after the last change).
; Follow  -  Car = the car the recorded player drives, Ped = the player.
Follow = Car
; Length  -  how long the video is, from the clip's start: 0 = the whole
;   clip, or 5, 8, 10, 12, 15, 20, 25, 30, 45, 60 seconds (the end marker
;   moves there).
Length = 0
; Markers  -  how many markers WR Automate makes between the clip's start
;   and end marker, 3 - 30. More markers = more camera moves.
Markers = 8
; Style  -  Mixed  = sweeps round to the sides and the front
;           Orbit  = circles the car the whole way
;           Chase  = stays behind it, swinging up high
;           Low    = down at the asphalt: low quarters, low sides, a low chase
;           Drone  = high and wide: rear quarters from above, shots straight down
;           Story  = Mixed with a face insert every few shots (the player's
;                    face / a driver cam, cut in and out)
Style = Mixed
; Shake  -  Auto = a shake that fits each shot (Car, Helicopter on high
;   shots, Handheld on the sides), Off, or one preset for every marker:
;   Handheld, Walk, Run, Car, Helicopter, Earthquake, Drone, Boat,
;   Shoulder Rig, Motorbike, Combat.
Shake = Auto
; Distance  -  how far the cameras stay from the car / ped: Mixed = every shot
;   its own (close low fronts, wide high rears, extra room for donuts), or
;   metres: 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 30 (a car keeps at least 4 m).
Distance = Mixed
; Height  -  how high the cameras fly over the ground: Mixed = every shot its
;   own height (low fronts, high rears), Low (0.3 m, near the ground), or
;   metres: 1, 2, 3, 5, 8, 12, 20 (12 / 20 = drone shots).
Height = Mixed
; TiltMax / TiltMin  -  the WR Automate page's Tilt rows (saved here from the editor):
;   every marker leans left or right (a dutch angle) between TiltMin and TiltMax
;   degrees and WR Blend sways it calmly from marker to marker - with a Music song
;   on the beat (more when loud, the most on the drop). TiltMax 0 = Off (level
;   horizon), 1 - 45. TiltMin 0 - TiltMax. Default 10 / 3.
TiltMax = 10
TiltMin = 3
; Blend  -  how the shots join: WR Blend = the camera glides from marker to
;   marker (default), Hard Cut = every marker cuts to its own camera, which
;   stays put and pans with the car until the next cut.
Blend = WR Blend
; CutFollowCar / CutNewAngle / CutPanWithCar  -  Hard Cut only (1 = on):
;   ride along with the car / every cut a different angle / keep turning
;   toward the car (0 = a fixed view the car drives through).
CutFollowCar = 0
CutNewAngle = 1
CutPanWithCar = 1
; Music  -  Beat Sync: a song file from the Music folder next to this ini
;   (plugins\WR Editor Fix\Music\ - mp3, wav, m4a, flac, wma) or Off. WR Automate
;   cuts on its beat; the WR Automate page's Music row / Music page set it.
; MusicStartBar / MusicEndBar  -  the song section in bars. MusicEndBar = Clip
;   (default) = Whole clip: from the start bar to the end of the clip (or of
;   the song if it ends first), ending on a bar. CutEvery  -  Beat, 2 beats,
;   Bar, 2 bars or 4 bars (as many cuts as the clip takes, else coarser).
Music = Off
MusicStartBar = Auto
MusicEndBar = Auto
CutEvery = Bar
; MusicVolume  -  how loud the song plays in the editor when you press Play
;   after a Beat Sync Automate (0 = silent, 100 = full). Not in the export.
MusicVolume = 80
; BeatFxCuts (the Mix row) / BeatFxZoom / BeatFxShake / BeatFxAmount
;   Beat FX for Beat Sync runs (Music page). Mix = Blend + Hard Cut / Only Blend /
;   Only Hard Cut. Zoom, Shake Hit = Off / Music (follows the song:
;   loudness, bass, drops) / their own patterns. Amount 25 / 50 / 75 / 100 = how hard.
BeatFxCuts = Blend + Hard Cut
BeatFxZoom = Music
BeatFxShake = Music
BeatFxAmount = 75
; BeatFxVibe = Custom / Chill / Cinematic / Hype - one pick that sets every Beat FX row
;   (Chill = glides only, gentle; Cinematic = blend + a few cuts, push-ins;
;   Hype = blend + hard cuts, whip pans, push-ins, all hard). Custom = the rows below.
; BeatFxWhip / BeatFxPush = Off / Music: whip pans into loud beats / push-ins on the hits
;   (WR Blend parts only, so not with Only Hard Cut). Tilt = TiltMax / TiltMin.
BeatFxVibe = Custom
BeatFxWhip = Off
BeatFxPush = Off
; BeatFxGlide = Music / Off: how the camera moves between markers. Music = calm parts glide
;   through, loud beats + the drop: the blend settles onto the beat and pushes off again
;   (the motion pulses with the song). Off = one smooth glide. Default Music.
BeatFxGlide = Music
; BeatFxSpeed = Off / Music: slow motion from the song - the last bar into a drop at 50 %
;   (the hit at full speed), a quiet intro at 50 %, loud bar starts at 125 % (Amount 50 %+).
;   The video keeps the song's beats. Default Off (the Cinematic / Hype Vibes use Music).
BeatFxSpeed = Off

; AvoidObstacles  -  the WR Automate page's Checks row (saved here from the editor):
;   1 = On: after placing the markers WR Automate runs along the clip again
;   and moves any camera that would touch something or lose sight of the car /
;   ped for over a second (passing behind traffic or a pole is fine; with your
;   own Distance / Height it stays near them). 3 = Keep visible: On + a camera
;   that still can't see the car / ped goes onto its path behind it (then
;   higher), so it is never hidden behind a wall for long. 2 = Ground only:
;   only cameras under the ground move. 0 = Off: no checks, the cameras stay
;   exactly on their shots.
AvoidObstacles = 3


;==============================================================================
;  [Editor Look]   -   how the Rockstar Editor looks. Everything about the
;  editor's look lives here: the theme, the header logo, the font and colours.
;  Only while the editor is open; the game looks stock everywhere else.
;  Game builds b3258, b3095 + b3407 only.
;
;  Colours: RRGGBB hex (E01234 = WR red). Blank = the built-in colour.
;     FFFFFF = white        000000 = black        808080 = grey
;     FF0000 = red          00FF00 = green        0000FF = blue
;     FFFF00 = yellow       00FFFF = cyan         FF00FF = magenta / pink
;     FF8000 = orange       8000FF = purple       E01234 = WR red
;  Any colour picker (Photoshop, Vegas, google "color picker") shows the hex
;  code - copy the 6 characters without the #.
;==============================================================================
[Editor Look]

; Theme  -  the editor's whole look:
;   Default = the stock Rockstar Editor. Only the Font changes.
;   WR      = the WR look (Neon Glass): frosted glass menu with a neon pill on
;             the selected row, one glass panel for the time + playback
;             buttons, a slim timeline with a red played line, a glowing
;             playhead and diamond markers, the WR header. Font + TimelineSize
;             change, the rest is WR's own.
;   Custom  = every part your own: Header, Font, TimelineSize and the
;             colours below, on the WR look or the Default one (CustomBase).
;   (Neon = the name before v1.1.0, reads as Custom.) Only on the clip edit
;   screen (where you edit markers) - the other editor screens stay stock.
;   Also in the editor: marker menu -> WR Options -> Editor Look -> Theme.
;   WR <-> Custom changes right away; to or from Default the next time the
;   editor opens.
Theme = WR

; CustomBase  -  the look Theme = Custom starts from: WR (the WR look, the WR
;   look colours below) or Default (the stock look, its MenuText /
;   MenuTextGreyed colours below). Also in the editor: WR Options -> Editor
;   Look -> Base Look (Custom), live.
CustomBase = WR

; Header  -  the logo at the top of the editor menu: Stock (the original
;   R* EDITOR), WR, Meme, Retro or Cinematic. Built into the .asi.
;   Used with Theme = Custom (Default shows the stock header, WR the WR
;   one). Also in the editor: marker menu -> WR Options -> Editor Look ->
;   Header Style / Header Motion (Custom) switch it live, and the pick is
;   saved back into these lines.
Header = Meme
; HeaderAnimated  -  1 = animated (Meme, Retro, Cinematic move), 0 = still picture.
HeaderAnimated = 1

; Wallpaper  -  the picture behind the editor's front page (Create New Project,
;   Load Project ...): WR (the WR wallpaper, default), Drift, Inside, Canyon,
;   Sunset, or Rockstar (the game's own grey background). Only on the front
;   page - with a project open the game shows its live preview there. Also the
;   front page's own row WR Wallpaper (left / right, saved here).
Wallpaper = WR

; Font  -  the font of every editor menu and text (both themes). Built into the
;   .asi, free fonts from Google Fonts (licences in the release's Fonts folder).
;     Default           the original Rockstar Editor font
;     Chakra Petch      techy, clean
;     Spicy Rice        wild, chunky
;     Bagel Fat One     round, bubbly
;     Oswald            clean, condensed
;     Carter One        bold, playful
;     Ubuntu Mono       code style
;     Permanent Marker  marker pen
;     Germania One      old-style blackletter
;     Kavoon            fat brush
;     Sriracha          handwriting
;   Also in the editor: marker menu -> WR Options -> Font switches it live, and
;   the pick is saved back into this line.
Font = Default

; TimelineSize - how big the editor timeline is: its markers, start / end and
;   playhead, and how thick the bar is. 50 - 300 (percent), 100 = the original size.
;   Also in the editor: marker menu -> WR Options -> Timeline Size changes it
;   live, and the pick is saved back into this line.
TimelineSize = 100

; Language - the language of the WR rows (labels and values):
;   English (default), Spanish, French, German, Italian, Portuguese, Dutch,
;   Finnish, Swedish, Indonesian, Polish, Turkish, Russian, or Auto = your
;   Windows language. The long help
;   texts stay English for now. Also in the editor: WR Options -> WR Editor Look
;   -> Language switches it live, and the pick is saved back into this line.
Language = English

; --- WR look colours (Theme = Custom). Blank = the built-in colour shown in ( ).
;   Also in the editor: marker menu -> WR Options -> Colors picks them live
;   from a palette and saves them back into these lines.
; Glass  -  the frosted glass: menu panel, time + button panel, timeline rail (404A68).
Glass =
; Selection  -  the neon pill around the selected menu row (FF2D55).
Selection =
; Buttons  -  the glow of the playback buttons, hover + pressed (FF2D55).
Buttons =
; Icons  -  the playback button icons themselves (FFFFFF).
Icons =
; Time  -  the time above the playback buttons (FFFFFF).
Time =
; Timeline  -  the played line and the glowing playhead (FF2D55).
Timeline =
; Markers  -  the diamond markers on the timeline, start + end included (2DE2FF).
Markers =
; HelpBox  -  the box with the help line under the menu (1E2436).
HelpBox =

; --- Stock-look colours: used by Theme = Custom with CustomBase = Default (and
;   on game builds without the WR editor movie). Theme = Default is always the
;   pure stock look. Also in WR Options -> Editor Look -> Colors (live).
; MenuText  -  row labels + values (Camera Type, Free Camera, None, 100%...)
;   and the playhead marker on the timeline.
MenuText =
; MenuTextGreyed  -  greyed-out rows, the timeline's played region + range
