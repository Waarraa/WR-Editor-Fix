MenuTextGreyed =


;==============================================================================
;  [Editor Loading Screen]   -   the WR loading screen when you open the
;  Rockstar Editor from FiveM's main menu (instead of FiveM's default one).
;  Shown the moment you press "Rockstar Editor" + Yes, closes by itself when
;  the editor is ready. Double-click it to close it early.
;  Needs the Microsoft Edge WebView2 Runtime - built into Windows 11; on
;  Windows 10 it comes with Microsoft Edge (if it's missing, the log says so
;  and FiveM's own screen is used). Works best with the game in
;  "Windowed Borderless" mode.
;
;  !! TESTED ON WINDOWS 11 !!
;  On Windows 10, or if anything looks wrong while the editor opens (black,
;  white or frozen screen, flickering, the game minimising, a missing or
;  double mouse cursor, a crash right after pressing "Rockstar Editor"), set
;  LaunchScreen = 0 below to be safe. FiveM's own loading screen comes back and
;  NOTHING else changes - the crash fix and every other feature keep working.
;  Please send your Logs folder on Discord so it can be fixed:
;  discord.gg/FKJ27bhqfJ
;==============================================================================
[Editor Loading Screen]

; LaunchScreen  -  1 = on, 0 = off (FiveM's default loading screen).
LaunchScreen = 1

; LaunchScreenTimeoutSec  -  safety cap: the screen closes after this many
;   seconds even if the editor never reports ready. 30..900, default 300.
LaunchScreenTimeoutSec = 300

; ClipScreen  -  1 = the WR clip screen while a clip loads in the editor
;   (after pressing Edit on a clip), instead of the stock "Preparing clip"
;   screen. Closes by itself when the editor is ready. 0 = stock screen.
ClipScreen = 1

; UpdateCheck  -  1 = the loading screen asks GitHub for the latest WR Editor
;   Fix releases (update log + "Update available" note when a newer version
;   is out). 0 = no network request, the built-in update log is shown.
UpdateCheck = 1


;==============================================================================
;  [Export Watermark]   -   the watermark at the start of every export
;
;  Every Rockstar Editor export starts with a watermark in the top-left
;  corner: the R* Editor icon + two lines of text that slide in for a few
;  seconds. Works for every export (the stock export, WR Export, with NVE too).
;  WR / Custom / Off and the lines are read again at every export - change,
;  save, export, no restart. Changing TO or FROM Stock needs a FiveM restart:
;  the R* logo is picked once, when the editor opens.
;==============================================================================
[Export Watermark]

; Watermark  -  what shows:
;   WR     = the WR Editor Fix watermark (default): "Change me inside .ini" /
;            "- WR Editor Fix By Warraa_". Your own text: Custom + Line1 / Line2
;   Custom = your own text: Line1 + Line2 below
;   Stock  = Rockstar's own (the R* logo + your Social Club name + the project name)
;   Off    = clean, no watermark at all
Watermark = WR

; Line1 / Line2  -  your two lines for Watermark = Custom. An empty line stays
;   empty. The R* logo only shows with Stock. Room: about 85 characters per
;   line. An editor opened from inside a server session keeps the game's own
;   watermark: there Line1 shows about 40 characters, Line2 about 50 - longer
;   text is cut off (the log says so).
Line1 =
Line2 =

; Logo  -  your own picture (PNG with transparency, or JPG / BMP) on every frame of
;   a WR Export video: the file name of a picture in this folder (plugins\WR Editor Fix\)
;   or a full path. Empty = no logo (default). Drawn after ReShade and the motion blur,
;   so it stays sharp and keeps its colours. WR Export only (not the stock export).
; LogoCorner  = TopLeft / TopRight / BottomLeft / BottomRight (default BottomRight)
; LogoSize    = the logo's height in % of the video height, 3 - 40 (default 10)
; LogoOpacity = 5 - 100 % (default 85)
; LogoMargin  = the gap to the video's edges in % of its height, 0 - 20 (default 3)
;   All read again at every export - change, save, export.
Logo =
LogoCorner = BottomRight
LogoSize = 10
LogoOpacity = 85
LogoMargin = 3


;==============================================================================
;  [WR Export]   -   the editor's Export, written by WR Editor Fix
;
;  On by default. The export button, frames and timing stay the game's own -
;  WR writes the video file: your output folder, HEVC / H.264 / AV1 on the
;  graphics card's encoder (NVIDIA / AMD / Intel) or H.264 on the CPU, any
;  resolution (1440p / 4K), real motion blur and ReShade in the video.
;  Every video setting lives in WR_Export_Settings.ini next to this file - and
;  in the editor's Export screen (the WR EXPORT rows, saved straight into it).
;  Guide: Guides\12 - WR Export.md
;==============================================================================
[WR Export]

; Enabled  -  1 = WR Export writes the editor's exports (default).
;   0 = the editor's own stock export.
;   EVE (ExtendedVideoExport) is NOT supported: with EVE installed WR Export
;   steps aside (two exporters on one video writer can crash) and the loading
;   screen warns you. Remove EVE.
;   Needs a relaunch.
Enabled = 1



;------------------------------------------------------------------------------
;  Developer / experimental settings (menu-row WIP, diagnostic scans, unsafe
;  experiments) are NOT in this file any more. They live in an optional
;  WR_Editor_Fix_Dev.ini next to this one, which the release doesn't ship -
;  if it's absent, everything in it is simply off.
;------------------------------------------------------------------------------


;==============================================================================
;  [Editor World]   -   WR World: the world of the clip (WR Options -> WR World).
;  Editor only - preview and WR Export. Game builds b3258, b3095 + b3407 only.
;==============================================================================
[Editor World]
; Road Wetness, Car Lights, Clean Cars and Empty City (WR Options -> WR World)
;   are per clip: every fresh clip starts at the defaults (Clip / Clip / Clip /
;   Empty City off), a clip you open again keeps what you picked for it while
;   the game runs. Nothing to set here.
; MapDetail  -  where the world loads in full detail: Player (default, the game's
;   way) or Camera (around the free camera - far shots get full-detail trees and
;   buildings). Also the row WR Options -> WR Camera -> Map Detail.
MapDetail = Player


;==============================================================================
;  [Scene Lights]   -   WR Lights: your own lamps and spotlights in a clip
;  (marker menu -> WR Options -> WR Lights). Editor only.
;==============================================================================
[Scene Lights]
; Enabled  -  1 = on (default). 0 = fully off: none of the light code runs and
;   the WR Lights row is hidden (lights saved in a project stay in the file).
;   Only for testing a lighting problem. Needs a FiveM restart.
Enabled = 1


;==============================================================================
;  [WR Quick Menu]   -   the round WR menu over the clip editor (docs/75).
;  Press the key (or the pad button) while you edit a clip: pick a slot with the
;  mouse, the arrow keys or the left stick, Enter / click / A opens it, Esc /
;  right click / B closes. C / Y edits the slot under the pointer: a big panel
;  with every option as a tile (click / Enter / A picks, Esc / B cancels). Your
;  8 slots are saved in
;  "Quick Menu.json" next to this ini. Editor only, never in an export.
;==============================================================================
[WR Quick Menu]
; Enabled  -  1 = on (default), 0 = off.
Enabled = 1
; Key  -  the key that opens / closes it: J (default), CapsLock, Tilde, Insert,
;   Home, End, PageUp, PageDown, MButton (middle mouse), XButton1, XButton2,
;   F1 - F12 (not F8, that is FiveM's console), any single letter / digit, or
;   None. Not Tab (the editor's Snapmatic photo), not H (used by the editor).
Key = J
; PadButton  -  a controller button that opens / closes it: L3 (default, the
;   left stick press - the editor doesn't use it), R3, Back (View), Y, X,
;   DpadUp, DpadDown, or None.
PadButton = L3
; Glass  -  1 = frosted glass: the game shows blurred behind the menu (default).
;   0 = solid dark panels. Needs nothing from Windows (works with Transparency
;   effects off).
Glass = 1


;==============================================================================
;  [WR Buddy]   -   the little WR robot that keeps you company in the editor
;  (docs/78). He stands in a spot you pick, moves, dances and says something
;  now and then (tips, reactions to what you do, comments while WR Automate
;  builds or an export runs). Click-through: he never takes clicks or focus.
;  Never in an export. Also on the editor's front page and in WR Options >
;  WR Editor Look.
;==============================================================================
[WR Buddy]
; Enabled  -  1 = on (default), 0 = off.
Enabled = 1
; Position  -  TL, TC, TR, ML, MR, BL, BC or BR (default, bottom right).
Position = BR
; Size  -  Small (default), Medium, Large or Huge.
Size = Small
; Hints  -  1 = he says things in a speech bubble (default), 0 = he only moves.
Hints = 1
; Chatty  -  how often he does something on his own: Quiet, Normal or Chatty (default).
Chatty = Chatty
