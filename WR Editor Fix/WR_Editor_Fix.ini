; WR Editor Fix configuration (USER settings)
; Lives at: <FiveM plugins>\WR Editor Fix\WR_Editor_Fix.ini - next to the .asi.
; Edit a value, save, relaunch FiveM. Lines starting with ; are comments.
;
; The plugin never writes this file; the release ships it ready to use.
; Developer/experimental keys are NOT here - they live in the optional
; WR_Editor_Fix_Dev.ini (see the note at the bottom of this file).

;==============================================================================
;  WR Editor Fix  -  configuration
;
;  Edit a value, save the file, relaunch FiveM. Lines starting with ; are
;  comments. Unless a line says otherwise: 1 = on, 0 = off.
;  Logs go to the Logs\ subfolder next to this file (created automatically).
;  If you report a crash, send everything in Logs\.
;==============================================================================


;------------------------------------------------------------------------------
;  [Logging]   -   which files this plugin writes
;------------------------------------------------------------------------------
[Logging]

; SessionLog  -  WR_Editor_Fix.log, the main activity log.
;   0 = off       nothing written
;   1 = normal    startup + each unique crash point recovered once   (default)
;   2 = verbose   + periodic recovery totals
;   3 = debug     + every single recovered fault (very noisy)
SessionLog = 1

; CameraFeaturesLog  -  1 = include the editor-camera feature lines
;   ("[Camera] [Leash] ...", zoom / collision / move-speed engaged, values
;   applied) in WR_Editor_Fix.log. 0 = leave them out.
CameraFeaturesLog = 1

; BrokenAssetsReport  -  WR_BrokenAssets.log, written only if a stuck server
;   download actually had to be skipped (a plain summary for your server
;   owner). Harmless to leave on.
BrokenAssetsReport = 1

; FreshLogs  -  1 = wipe every WR_*.log in this folder on each launch,
;               0 = keep appending across launches.
FreshLogs = 1


;------------------------------------------------------------------------------
;  [Crash Fix]   -   the core Rockstar Editor crash fix. Leave these on.
;------------------------------------------------------------------------------
[Crash Fix]

; ExceptionHandler  -  the safety net that catches the editor's clip-load
;   crash family and recovers from it. This is the main fix.
ExceptionHandler = 1

; InlineGuards  -  extra null-checks placed right at the known crash
;   instructions. Recommended.
InlineGuards = 1

; WholeGameProtection
;   1 = guard the whole game module (default, best - also catches the same
;       bug in streaming / asset-unload code on heavy custom-asset servers)
;   0 = guard only the editor code region (tighter, but may miss some)
WholeGameProtection = 1


;------------------------------------------------------------------------------
;  [Stuck Downloads]   -   OPTIONAL / EXPERIMENTAL.
;  Fixes the editor hanging forever on "Downloading assets (0 of N)" /
;  "0.00 / 0.2 MB" when a server references an asset that 404s (e.g. missing
;  scenario region .ymt files). Less battle-tested than the crash fix above -
;  off by default, only turn on if you actually hit that infinite hang.
;------------------------------------------------------------------------------
[Stuck Downloads]

; SkipStuckDownloads  -  1 = release an un-fetchable asset after TimeoutMs so
;   the editor continues (that asset just won't appear).
SkipStuckDownloads = 0

; SkipStuckLocalAssets  -  1 = also release a genuinely frozen LOCAL entry
;   once it clears the same timeout (a broken download can leave local
;   entries stuck too, so this is usually needed). 0 = strict: only ever
;   release confirmed cache:/ downloads.
SkipStuckLocalAssets = 1

; TimeoutMs  -  how long an entry may hang before it's skipped. Default 12000.
TimeoutMs = 12000


;------------------------------------------------------------------------------
;  [Vehicle Meta]   -   OPTIONAL / EXPERIMENTAL.
;  Some servers ship a custom vehicle with a broken carvariations/handling
;  file. The game fails to parse it, then gets stuck in an endless loop the
;  moment a clip using that vehicle is loaded into a project (the editor
;  hangs, then dies with "Out of game memory" / "Invalid Pointer Free").
;  This remembers any vehicle file the game itself reports as malformed and
;  skips loading it from then on - same as if the server never shipped that
;  file. That vehicle may lose its custom colours/kits in the preview only.
;  The list is saved to WR_BrokenVehicleMeta.txt in this folder; delete
;  that file to forget everything learned.
;------------------------------------------------------------------------------
[Vehicle Meta]

; SkipBrokenVehicleMeta  -  1 = learn malformed vehicle meta files and skip
;   them on every later load. 0 = off (default).
SkipBrokenVehicleMeta = 0


;==============================================================================
;  [Editor Camera]   -   remove the Rockstar Editor free-camera restrictions.
;  Every option here is independent and on by default. Each one reads and
;  sanity-checks the game's real values before changing anything, and puts
;  them back the moment you set it to 0.
;
;  LIVE RELOAD: this section is re-read from disk about once a second while
;  FiveM is running - edit a value, save, and it takes effect in-game within
;  a second. No relaunch needed. (Every other section still needs a relaunch.)
;==============================================================================
[Editor Camera]

;  - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
;   Working   -   tested live, confirmed stable
;  - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

; UnlimitedCameraDistance  -  remove the leash that pulls the free-cam back
;   when it flies too far from the subject.
UnlimitedCameraDistance = 1
;   MaxCameraDistance  -  new limit, in metres (used when the above is 1).
MaxCameraDistance = 1000

; UncapZoom  -  widen the free-cam zoom range past its stock ~10-100 degrees.
;   The engine's shared 1..130 hard ceiling is deliberately left alone.
UncapZoom = 1
;   ZoomMinFov / ZoomMaxFov  -  degrees (used when UncapZoom = 1).
ZoomMinFov = 1.0
ZoomMaxFov = 130.0

; DisableCameraCollision  -  let the free-cam pass through world geometry
;   instead of being stopped or pushed by it.
DisableCameraCollision = 1

; FreeCamMoveSpeed  -  scale how fast the free-cam flies. The stock editor
;   caps it fairly low; this multiplies that cap.
FreeCamMoveSpeed = 1
;   FreeCamMoveSpeedMultiplier  -  1.0 = stock, 3.0 = 3x, etc (~0.25 to ~20).
;   LIVE: change this while the editor is open and flying - it applies
;   within ~1 second, no relaunch needed (see the LIVE RELOAD note at the
;   top of this section).
FreeCamMoveSpeedMultiplier = 3.0


;------------------------------------------------------------------------------
;  Developer / experimental settings (menu-row WIP, diagnostic scans, unsafe
;  experiments) are NOT in this file any more. They live in an optional
;  WR_Editor_Fix_Dev.ini next to this one, which the release doesn't ship -
;  if it's absent, everything in it is simply off.
;------------------------------------------------------------------------------
